<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" class="chart-svg"><text x="120.0" y="20.0" font-size="12" text-anchor="start" fill="var(--chart-ink)" class="">does the server agree with the file?</text><text x="740.0" y="20.0" font-size="9" text-anchor="end" fill="var(--chart-ink-muted)" class="">two separate samples; methods differ</text><text x="108.0" y="58.0" font-size="11" text-anchor="end" fill="var(--chart-ink)" class="">declared block</text><text x="108.0" y="72.0" font-size="9" text-anchor="end" fill="var(--chart-ink-muted)" class="">n=356 · path-aware sample</text><rect x="120.0" y="46.0" width="134.1" height="34.0" class="seg" fill="var(--chart-permissive)" data-label="declared block and behaves accordingly" data-value="22%" data-n="77"/><rect x="254.1" y="46.0" width="485.9" height="34.0" class="seg" fill="var(--chart-restrictive)" data-label="declared block but does the opposite" data-value="78%" data-n="279"/><text x="187.1" y="67.0" font-size="11" text-anchor="middle" fill="var(--chart-ink)" class="">22% match</text><text x="497.1" y="67.0" font-size="11" text-anchor="middle" fill="#ffffff" class="">78% contradict</text><text x="108.0" y="120.0" font-size="11" text-anchor="end" fill="var(--chart-ink)" class="">declared open</text><text x="108.0" y="134.0" font-size="9" text-anchor="end" fill="var(--chart-ink-muted)" class="">n=697 · root-test sample</text><rect x="120.0" y="108.0" width="518.6" height="34.0" class="seg" fill="var(--chart-permissive)" data-label="declared open and behaves accordingly" data-value="84%" data-n="583"/><rect x="638.6" y="108.0" width="101.4" height="34.0" class="seg" fill="var(--chart-restrictive)" data-label="declared open but does the opposite" data-value="16%" data-n="114"/><text x="379.3" y="129.0" font-size="11" text-anchor="middle" fill="var(--chart-ink)" class="">84% match</text><text x="689.3" y="129.0" font-size="11" text-anchor="middle" fill="#ffffff" class="">16% contradict</text><rect x